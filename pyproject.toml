[project]
name = "breachpath"
version = "0.1.0"
description = "Attack-path agent on FalkorDB: finds every path from a compromised identity to crown jewels, computes the smallest safe fix, applies it to a sandbox and proves it."
readme = "README.md"
requires-python = ">=3.12"
# Dependencies live in requirements.txt / requirements-dev.txt (single source of truth for Docker).

[tool.pytest.ini_options]
testpaths = ["tests"]
