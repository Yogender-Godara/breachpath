# LOCAL DEVELOPMENT ONLY. Never use this file on a deployed host.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d falkordb
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build api worker   (api on 127.0.0.1:${API_PORT:-8000})
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm toolbox python spikes/<script>.py
services:
  falkordb:
    ports:
      - "127.0.0.1:6379:6379"   # loopback only: for local scripts / the stdio MCP demo
      - "127.0.0.1:3300:3000"   # FalkorDB browser, loopback only

  api:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"   # loopback only: /docs and curl (API_PORT if 8000 is taken)

  # Throwaway Python 3.12 container for spikes, tests and data loading (no host installs needed)
  toolbox:
    build: .
    user: root   # the image runs as a non-root user; the toolbox writes into the bind-mounted repo
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    depends_on:
      falkordb:
        condition: service_healthy
    profiles: ["dev"]
