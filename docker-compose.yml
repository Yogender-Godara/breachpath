# BreachPath: deployed stack. falkordb, api and worker publish NO port (internal Docker network only); only `ui` will (added in P7/P9).
# Local-only ports (api on 127.0.0.1:8000, FalkorDB) and the toolbox live in docker-compose.dev.yml.
services:
  falkordb:
    image: falkordb/falkordb:6.0.2   # pinned: :latest drifted (graph ver 42201) after the image cache was lost
    environment:
      # Redis password. Set FALKORDB_PASSWORD in .env (copy env.example → .env).
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}   # used by the healthcheck below
    expose:
      - "6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FALKORDB_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: .
    image: breachpath:local   # api and worker are the same image with different commands
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: breachpath:local
    command: python -m worker.main
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
