# BreachPath: deployed stack. falkordb, api and worker publish NO port (internal Docker network only); only `ui` does (UI_PORT, default 8501).
# Local-only ports (api on 127.0.0.1:8000, FalkorDB) and the toolbox live in docker-compose.dev.yml.
services:
  falkordb:
    image: falkordb/falkordb:6.0.2   # pinned: :latest drifted (graph ver 42201) after the image cache was lost
    environment:
      # Redis password. Set FALKORDB_PASSWORD in .env (copy env.example → .env).
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}   # used by the healthcheck below
    expose:
      - "6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FALKORDB_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: .
    # api and worker are built from the same Dockerfile (the second build is fully cached) and run different commands
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:   # the slim image has no curl: python's urllib (a 503 raises, so the exit code is 1)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    command: python -m worker.main
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:   # the worker SETs worker:alive:<consumer> (60 s TTL) on every loop turn (worker/main.py): healthy = some such key exists
      test: ["CMD", "python", "-c", "import sys; from core.graph.client import get_db; sys.exit(0 if get_db().connection.keys('worker:alive:*') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  ui:
    build: .
    image: breachpath:local
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
    ports:
      - "${UI_PORT:-8501}:8501"   # the ONLY published port of the stack
    environment:
      API_URL: http://api:8000   # the UI only talks to the API (no database access)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  falkordb-data:
